src = ["src"]
line-length = 120
target-version = "py312"

extend-exclude = [
    "tests/flake8_lint/samples",
    # Text assets are test input data (deliberately broken docs and Python sources), not code.
    "tests/assets",
    # Canon data submodules are separate repositories with their own lint setup.
    "canons",
    # Vendored third-party skill (SpillwaveSolutions/plantuml); linting it would rewrite upstream code.
    ".claude/skills/plantuml"
]

[lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM102",
    "SIM108",
    "C4",
    "UP017",
    "UP037"
]

#   UP007 - Union[...] -> X | Y; Optional[X] -> X | None
#   SIM300 - Yoda condition x == f(a, b)
#   E402 - module level import not at top of file
#   E501 - the line is too long
ignore = [
    "UP007",
    "SIM300",
    "E402",
    "E501"
]

# extensions.py keeps six quoted `-> "None"` return annotations on purpose: docsig
# (SIG501) needs a return annotation, flakeforge X008 rejects a bare `-> None`, and
# the quoted form satisfies both (tests/flake8_lint/test_project_lint.py pins it).
# UP037 would strip the quotes on every Stop-hook `ruff --fix`, so it is off here only.
[lint.per-file-ignores]
"src/docsentinel/telemetry/extensions.py" = ["UP037"]
