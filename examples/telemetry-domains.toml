# Example DocSentinel configuration: label each document with a content domain.
#
# Copy these settings into docsentinel.toml at the scan root. In pyproject.toml,
# write [tool.doc_sentinel] and [[tool.doc_sentinel.telemetry_domains]] instead.
#
# builtin:domain sets the "domain" of every document in the JSON report
# (doc.domain), under doc.ext.domain.name for templates that require the
# extension, and in fault events (Milestone 0006). Without it, every document is
# in the "docs" domain. The label is asserted by the repository, not verified.
#
# Rules are tried in array order and the first matching glob wins. Globs match
# the scan-root-relative path with "/" separators, case-sensitively:
#   **   a whole segment: zero or more directories
#   *    any characters inside one segment (never "/"); "*" alone is top-level files only
#   ?    exactly one character inside one segment
# [ ] { } \ and a leading ! are not supported. Domains match ^[a-z][a-z0-9_-]{0,63}$.
# At most 256 rules. A path no rule matches gets the domain "docs".
#
# This is an array of tables, so a TOML formatter that sorts keys cannot reorder it.

telemetry_extensions = ["builtin:domain"]

[[telemetry_domains]]
glob = ".claude/agents/**"
domain = "agent"

[[telemetry_domains]]
glob = ".claude/skills/**"
domain = "agent"

[[telemetry_domains]]
glob = "docs/**"
domain = "docs"

[[telemetry_domains]]
glob = "adr/**"
domain = "docs"

# Catch-all: everything else. Spell it "**", not "*".
[[telemetry_domains]]
glob = "**"
domain = "docs"
